# ========================================================
# Mosquitto MQTT Broker Configuration File
# Chuẩn bài thực hành IoT (2.TH.docx & 2.MOS.pptx)
# ========================================================

# 1. Cổng TCP truyền thống dành cho Thiết bị Nhúng (ESP32) & Ứng dụng Desktop (Java)
listener 1883 0.0.0.0
socket_domain ipv4

# 2. Cổng WebSocket dành riêng cho Trình duyệt Web (Web Dashboard)
listener 9001 0.0.0.0
protocol websockets

# 3. Cấu hình bảo mật & Xác thực tài khoản
# Để bật xác thực mật khẩu theo tài liệu 2.TH.docx:
# - Đặt allow_anonymous false
# - Chỉ định file password_file password.txt
allow_anonymous true
# allow_anonymous false
# password_file password.txt

# 4. Ghi log hoạt động
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
